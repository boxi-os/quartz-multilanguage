<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Umgezogen</title>
<meta name="robots" content="noindex">
<script>
(function () {
  var rest = location.pathname.replace(/^\/quartz-multilanguage\/?/, '')
  var en = rest === 'en' || rest.indexOf('en/') === 0
  if (en) rest = rest.replace(/^en\/?/, '')
  var to = "https://boxi-os.github.io/quartz-plugins/" + (en ? 'en/' : '') + (/^tags(\/|$)/.test(rest) ? '' : "multilanguage/") + rest
  location.replace(to + location.hash)
})()
</script>
</head>
<body>
<p>Dieses Handbuch liegt jetzt unter <a href="https://boxi-os.github.io/quartz-plugins/multilanguage/">https://boxi-os.github.io/quartz-plugins/multilanguage/</a>.</p>
</body>
</html>
